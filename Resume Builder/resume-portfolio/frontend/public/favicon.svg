<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0073e6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#faviconGrad)" />
  
  <!-- Document Container -->
  <rect x="112" y="96" width="288" height="320" rx="28" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Document Lines representing Resume content -->
  <line x1="160" y1="160" x2="270" y2="160" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
  <line x1="160" y1="220" x2="352" y2="220" stroke="#ffffff" stroke-opacity="0.85" stroke-width="16" stroke-linecap="round" />
  <line x1="160" y1="272" x2="352" y2="272" stroke="#ffffff" stroke-opacity="0.85" stroke-width="16" stroke-linecap="round" />
  <line x1="160" y1="324" x2="280" y2="324" stroke="#ffffff" stroke-opacity="0.85" stroke-width="16" stroke-linecap="round" />
  
  <!-- Sparkle AI Star -->
  <path d="M370 270 C370 305 385 320 420 320 C385 320 370 335 370 370 C370 335 355 320 320 320 C355 320 370 305 370 270 Z" fill="url(#sparkleGrad)" />
</svg>
